name: PV-Prognose zweimal täglich archivieren

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Europe/Berlin'
    - cron: '0 18 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pv-prognose-archiv
  cancel-in-progress: false

jobs:
  archiviere:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository holen
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Python vorbereiten (nur GitHub-Server)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: DWD MOSMIX L unabhängig abrufen
        # DWD-Ausfall darf Open-Meteo nicht blockieren; im Log bleibt der Fehler sichtbar.
        continue-on-error: true
        run: python scripts/dwd_mosmix.py

      - name: Messwoche oder manueller Test?
        id: archive_window
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo('Europe/Berlin')).strftime('%Y-%m-%d')
          active=(os.environ.get('WORKFLOW_EVENT')=='workflow_dispatch' or '2026-11-01'<=day<='2026-11-07')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"active={'true' if active else 'false'}\n")
          print('Prognosearchiv aktiv:',active,'Tag:',day)
          PYCODE

      - name: Chromium und Playwright vorbereiten
        if: steps.archive_window.outputs.active == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium

      - name: Prognose im echten Browser berechnen und archivieren
        if: steps.archive_window.outputs.active == 'true'
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          PV_SITE_URL: https://solarbergler.github.io/solarprognose_1/
        run: python scripts/archiviere_prognose.py

      - name: DWD und Prognosedateien dauerhaft speichern
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prognosen/
          if git diff --cached --quiet; then
            echo 'Keine neuen Daten'
          else
            git commit -m 'PV-Prognose und DWD-Wetterstand archiviert'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fehlerbild zur Diagnose sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pv-prognose-fehlerbild
          path: pv_archiv_fehler.png
          if-no-files-found: ignore
          retention-days: 7
