name: Production window verification
on:
  push:
    branches: [verify-production-window-v12-8-3]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          echo "PW_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Existing regression tests
        run: |
          node tests/inverters.test.cjs
          node tests/central-config.test.cjs
          python tests/test_dwd_configuration.py
          python tests/test_central_browser.py
          python tests/test_startup.py
          python tests/test_profile_publication.py
      - name: Production window and mobile layout
        run: python tests/verify_production_window.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-window-screenshots
          path: /tmp/production-*.png
